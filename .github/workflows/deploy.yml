name: Deploy
on:
  workflow_dispatch:
    inputs:
      deployChannels:
        description: 'Channels to deploy'
        required: true

jobs:
  deploy_webhooks:
    name: Build and deploy webhooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: yarn install

      - name: Build code
        run: yarn build

      - name: Run deploy code
        run: yarn deploy
        env:
          RULES: https://discord.com/api/webhooks/${{ secrets.WEBHOOK_RULES_ID }}/${{ secrets.WEBHOOK_RULES_TOKEN }}
          ROLES: https://discord.com/api/webhooks/${{ secrets.WEBHOOK_ROLES_ID }}/${{ secrets.WEBHOOK_ROLES_TOKEN }}
          FAQ: https://discord.com/api/webhooks/${{ secrets.WEBHOOK_FAQ_ID }}/${{ secrets.WEBHOOK_FAQ_TOKEN }}
          ABOUT_US: https://discord.com/api/webhooks/${{ secrets.WEBHOOK_ABOUT_US_ID }}/${{ secrets.WEBHOOK_ABOUT_US_TOKEN }}
          OFFCIAL_LINKS: https://discord.com/api/webhooks/${{ secrets.WEBHOOK_OFFICIAL_LINKS_ID }}/${{ secrets.WEBHOOK_OFFICIAL_LINKS_TOKEN }}
          WEBHOOK_AVATAR: ${{ secrets.WEBHOOK_AVATAR }}
          WEBHOOK_NAME: ${{ secrets.WEBHOOK_NAME }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          DEPLOY_CHANNELS: ${{ github.event.inputs.deployChannels }}
